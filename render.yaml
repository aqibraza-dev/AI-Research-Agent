services:
  - type: web
    name: research-agent-v2-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Supabase Connect > Transaction pooler URI (IPv4-compatible, port 6543).
      # Copy its exact host and username; the direct db.* endpoint normally requires IPv6.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OPEN_ROUTER_FREE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: SCHEDULER_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WORKER_ENABLED
        value: "true"
